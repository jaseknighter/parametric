name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: 

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Unified Test Suite
        env:
          VITE_COVERAGE: "true"
        continue-on-error: true 
        run: |
          npm test -- --coverage --watchAll=false
          VITE_COVERAGE=true npx playwright test
          node scripts/merge-coverage.cjs
          node scripts/generate-coverage-table.cjs

      - name: Upload Test Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            monocart-report/
            playwright-report/
            test-results/
          retention-days: 7

      - name: Auto-commit snapshot updates
        id: auto_commit
        if: always()
        continue-on-error: true 
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update snapshots and coverage [skip ci]"
          file_pattern: 'README.md tests/'
          disable_globbing: true

  build-and-deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: holding-area

      - name: Build
        run: npm run build
        env:
          VITE_COVERAGE: true

      - name: Security Audit & Path Scrubbing
        if: always()
        run: |
          echo "🔍 Scanning Monocart reports for sensitive patterns..."
          FORBIDDEN=("/Users/" "/home/runner/work/" "secret_key")
          for pattern in "${FORBIDDEN[@]}"; do
            if grep -ri "$pattern" holding-area/monocart-report; then
              echo "⚠️ Scrubbing '$pattern' from Monocart HTML..."
              grep -rl "$pattern" holding-area/monocart-report | xargs -r sed -i "s|$pattern|[REDACTED]|g"
            fi
          done
          echo "✅ Targeted Scrubbing complete."

      - name: Bundle Reports into Dist
        if: always() 
        run: |
          mkdir -p dist/monocart-report dist/playwright-report
          if [ -d "holding-area/monocart-report" ]; then
            echo "📦 Copying Monocart Report + All Assets..."
            cp -RT holding-area/monocart-report/ dist/monocart-report/
          fi
          if [ -d "holding-area/playwright-report" ]; then
            echo "📦 Copying Playwright Report + All Assets..."
            cp -RT holding-area/playwright-report/ dist/playwright-report/
          fi
          touch dist/.nojekyll
          echo "📂 Deployment Verification (Searching for CSS/JS):"
          find dist/monocart-report -name "*.css" -o -name "*.js" | head -n 10

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4