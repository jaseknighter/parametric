name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Smoke Suite
        run: npm run test:full-baseline:ci
        env:
          CI: true
          VITE_COVERAGE: true

      # 🟢 NEW AUTOMATION STEP:
      - name: Auto-commit snapshot updates
        if: always() # Run even if tests failed (because snapshots might have updated)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update snapshots from CI [skip ci]"
          # 🟢 Scope write access to ONLY the snapshot folders
          file_pattern: 'tests/**/*.spec.js-snapshots/*.png'
          disable_globbing: false

      # 🔍 DIAGNOSTIC: Run this IMMEDIATELY after tests if they fail
      - name: List Files for Debugging
        if: always()
        run: |
          echo "Checking root directory:"
          ls -F
          echo "Searching for monocart-report directory:"
          find . -name "monocart-report" -type d

      - name: Upload Test Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: parametric-test-results # Changing the name to be sure it's fresh
          path: test-results/ # 🟢 THIS IS THE KEY
          retention-days: 7
          
      - name: Build
        run: npm run build

      # 🟢 NEW: Inject Reports into the Build Distribution
      - name: Inject Reports into Dist
        if: always() # Ensures reports are available even if some tests failed
        run: |
          echo "Creating report directories in dist..."
          mkdir -p dist/reports/coverage
          mkdir -p dist/reports/playwright
          
          echo "Copying Monocart Coverage Report..."
          # Note: monocart-report/coverage contains the HTML/JS/CSS
          if [ -d "monocart-report/coverage" ]; then
            cp -r monocart-report/coverage/* dist/reports/coverage/
          fi
          
          echo "Copying Playwright HTML Report..."
          if [ -d "playwright-report" ]; then
            cp -r playwright-report/* dist/reports/playwright/
          fi
          
          # Optional: Create a simple index file for the reports folder
          echo "<html><body><h1>QA Dashboards</h1><ul><li><a href='coverage/'>Coverage Report</a></li><li><a href='playwright/'>Playwright Results</a></li></ul></body></html>" > dist/reports/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4