name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 🟢 Run tests and update snapshots for the Linux environment
      - name: Run Smoke Suite
        run: npm run test:full-baseline -- --update-snapshots
        env:
          CI: true
          VITE_COVERAGE: true

      # 🟢 Upload the evidence (Monocart includes both coverage and test results)
      - name: Upload Test Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: parametric-test-reports
          path: monocart-report/
          retention-days: 7

      # 🟢 Build the production app
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4