name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: 

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Unified Test Suite
        run: |
          # 1. Run Jest (Unit) - This creates /coverage/coverage-final.json
          npm test -- --coverage --watchAll=false
          
          # 2. Run Playwright (E2E) - This creates /raw-shards/*.json
          VITE_COVERAGE=true npx playwright test
          
          # 3. Merge Shards & Generate HTML
          node scripts/merge-coverage.cjs
          
          # 4. Update README Table with fresh data
          node scripts/generate-coverage-table.cjs

      # 🟢 NEW AUTOMATION STEP:
      - name: Auto-commit snapshot updates
        id: auto_commit
        if: always() # Run even if tests failed (because snapshots might have updated)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update snapshots and coverage [skip ci]"
          # 🟢 Scope write access to ONLY the snapshot folders and README
          file_pattern: 'tests/**/*.spec.js-snapshots/*.png README.md'
          disable_globbing: false

      - name: Upload Test Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            monocart-report/
            playwright-report/
            test-results/
          retention-days: 7

  build-and-deploy:
    needs: test # <--- THIS IS THE KEY: Wait for tests to finish
    if: always() # Run even if tests failed (to deploy reports)
    runs-on: ubuntu-latest
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports

      - name: Build
        run: npm run build
        env:
          VITE_COVERAGE: true # 🟢 Ensure the build is instrumented

      - name: Security Audit & Path Scrubbing
        if: always()
        run: |
          echo "🔍 Scanning reports for sensitive patterns..."
          
          # 1. Define forbidden patterns (Local paths, sensitive keywords)
          # We include the runner path to ensure internal CI metadata isn't leaked
          FORBIDDEN=("/Users/" "password" "secret_key" "127.0.0.1" "/home/runner/work/")
          
          for pattern in "${FORBIDDEN[@]}"; do
            if grep -ri "$pattern" playwright-report monocart-report; then
              echo "⚠️ WARNING: Sensitive pattern '$pattern' detected in reports."
              
              # 2. Automated Scrubbing (Optional but recommended)
              # Instead of failing, we 'anonymize' the files in place
              echo "🛡️ Scrubbing detected patterns..."
              grep -rl "$pattern" playwright-report monocart-report | xargs sed -i "s|$pattern|[REDACTED]|g"
            fi
          done
          echo "✅ Security Audit & Scrubbing complete."

      # 🟢 NEW: Bundle Reports into the Build Distribution
      - name: Bundle Reports into Dist
        if: always() 
        run: |
          # 1. Create a fallback dist if the build failed (so reports still deploy)
          if [ ! -d "dist" ]; then
            echo "⚠️ Build directory missing. Creating fallback."
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || echo "No index.html found in root"
          fi

          # 2. Add the .nojekyll guard for GitHub Pages
          touch dist/.nojekyll

          # 3. Create standardized report paths
          echo "Creating report directories in dist..."
          mkdir -p dist/reports/coverage
          mkdir -p dist/reports/playwright
          
          # 4. Copy Monocart (Merged) Report
          # Note: We copy from monocart-report/* directly based on your script
          if [ -d "monocart-report" ]; then
            echo "Copying Monocart Coverage Report..."
            cp -r monocart-report/* dist/reports/coverage/
          else
            echo "❌ Error: monocart-report directory not found!"
          fi
          
          # 5. Copy Playwright HTML Report
          if [ -d "playwright-report" ]; then
            echo "Copying Playwright HTML Report..."
            cp -a playwright-report/. dist/reports/playwright/
          else
            echo "❌ Error: playwright-report directory not found!"
          fi

          echo "✅ Bundling complete. Listing dist structure:"
          ls -R dist/reports

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This MUST point to the folder where you bundled everything
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4