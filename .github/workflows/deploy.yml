name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Smoke Suite
        run: npm run test:full-baseline:ci
        env:
          CI: true
          VITE_COVERAGE: true

      # 🔍 DIAGNOSTIC: Run this IMMEDIATELY after tests if they fail
      - name: List Files for Debugging
        if: always()
        run: |
          echo "Checking root directory:"
          ls -F
          echo "Searching for monocart-report directory:"
          find . -name "monocart-report" -type d

      - name: Upload Test Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: parametric-test-results # Changing the name to be sure it's fresh
          path: test-results/ # 🟢 THIS IS THE KEY
          retention-days: 7
          
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4