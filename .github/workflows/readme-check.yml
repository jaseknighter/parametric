name: README Integrity Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git tag verification in tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run README Integrity Tests
        run: npm run test:readme